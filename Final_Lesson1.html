<!DOCTYPE html>
<html>
<head>
<title>Calculator</title>
<script src="Finals_Lesson1.js" type="text/javascript"></script>
<script>
function showResult(operation) {
	const first = Number(document.getElementById('num1').value);
	const second = Number(document.getElementById('num2').value);
	let result;

	if (!Number.isFinite(first) || !Number.isFinite(second)) {
		result = 'Enter valid numbers';
	} else if (operation === '1') {
		result = first + second;
	} else if (operation === '2') {
		result = first - second;
	} else if (operation === '3') {
		result = first * second;
	} else if (operation === '4') {
		result = second === 0 ? 'Cannot divide by zero' : first / second;
	} else if (operation === '5') {
		result = second === 0 ? 'Cannot divide by zero' : first % second;
	}

	document.getElementById('result').value = result;
}
</script>
</head>
<body>


<h1>My calculator</h1>
<table border="1" cellpadding="5" cellspacing="5" width="600">
<tr align="center">
<td>First number</td>
<td>Second Number</td>
<td>Result</td>
</tr>
<tr align="center">
<td><input name="number1" type="text" size=10 id='num1'/></td>
<td><input name="number2" type="text" size=10 id='num2'/></td>
<td> <input type="text" id='result' readonly ></td>
</tr>
<tr>
<td colspan="3">
<button onclick="showResult('1')">+</button>
<button onclick="showResult('2')">-</button>
<button onclick="showResult('3')">*</button>
<button onclick="showResult('4')">/</button>
<button onclick="showResult('5')">%</button>
</td>
</tr>

</table>
</body>
</html>
