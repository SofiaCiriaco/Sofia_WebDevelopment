<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me - Ciriaco Form</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #76e6c0; margin: 0; padding: 40px;">

    <!-- Contact Section Wrapper -->
    <div style="max-width: 500px; margin: 0 auto; background-color: #b35353; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
        
        <h1 style="color: #2c3e50; margin-top: 0;">Contact</h1>
        
        <!-- Contact Information Block -->
        <p style="margin: 5px 0; color: #555;"><strong>Email:</strong> sofia.ciriaco@example.com</p>
        <p style="margin: 5px 0 25px 0; color: #555;"><strong>Phone:</strong> +63 912 345 6789</p>

        <hr style="border: 0; border-top: 1px solid #6b5c6a; margin-bottom: 20px;">

        <h3 style="color: #333; margin-bottom: 20px;">Send me a message:</h3>

        <!-- Form Start -->
        <form action="#" method="POST">
            
            <!-- 1. Text Input (Full Name) -->
            <div style="margin-bottom: 15px;">
                <label for="fullname" style="display: block; margin-bottom: 5px; font-weight: bold;">Full Name:</label>
                <input type="text" id="fullname" name="fullname" required style="width: 100%; padding: 8px; border: 1px solid #6b5c6a; border-radius: 4px; box-sizing: border-box;">
            </div>

            <!-- 2. Email Input -->
            <div style="margin-bottom: 15px;">
                <label for="email" style="display: block; margin-bottom: 5px; font-weight: bold;">Email:</label>
                <input type="email" id="email" name="email" required style="width: 100%; padding: 8px; border: 1px solid #6b5c6a; border-radius: 4px; box-sizing: border-box;">
            </div>

            <!-- 3. Password Input -->
            <div style="margin-bottom: 15px;">
                <label for="password" style="display: block; margin-bottom: 5px; font-weight: bold;">Password (for demo only):</label>
                <input type="password" id="password" name="password" style="width: 100%; padding: 8px; border: 1px solid #6b5c6a; border-radius: 4px; box-sizing: border-box;">
            </div>

            <!-- 4. Radio Buttons (Preferred Contact Method) -->
            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; font-weight: bold;">Preferred Contact Method:</label>
                <input type="radio" id="contact_email" name="preferred_contact" value="Email">
                <label for="contact_email" style="margin-right: 15px;">Email</label>
                
                <input type="radio" id="contact_phone" name="preferred_contact" value="Phone">
                <label for="contact_phone">Phone</label>
            </div>

            <!-- 5. Dropdown Menu (Inquiry Type - added to meet dropdown requirement) -->
            <div style="margin-bottom: 15px;">
                <label for="inquiry_reason" style="display: block; margin-bottom: 5px; font-weight: bold;">Reason for Inquiry:</label>
                <select id="inquiry_reason" name="inquiry_reason" style="width: 100%; padding: 8px; border: 1px solid #6b5c6a; border-radius: 4px; box-sizing: border-box;">
                    <option value="">-- Select Option --</option>
                    <option value="project">Project Collaboration</option>
                    <option value="hiring">Hiring / Employment</option>
                    <option value="general">General Question</option>
                </select>
            </div>

            <!-- 6. Checkboxes (Services Interested In) -->
            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; font-weight: bold;">Services Interested In:</label>
                <input type="checkbox" id="service1" name="services" value="Web Design">
                <label for="service1" style="margin-right: 10px;">Web Design</label>
                
                <input type="checkbox" id="service2" name="services" value="Programming">
                <label for="service2" style="margin-right: 10px;">Programming</label>
                
                <input type="checkbox" id="service3" name="services" value="Tutoring">
                <label for="service3">Tutoring</label>
            </div>

            <!-- 7. Textarea (Your Message) -->
            <div style="margin-bottom: 20px;">
                <label for="message" style="display: block; margin-bottom: 5px; font-weight: bold;">Your Message:</label>
                <textarea id="message" name="message" rows="5" required style="width: 100%; padding: 8px; border: 1px solid #6b5c6a; border-radius: 4px; box-sizing: border-box; resize: vertical;"></textarea>
            </div>

            <!-- 8. Submit and Reset Buttons -->
            <div>
                <input type="submit" value="Submit" style="background-color: #2c3e50; color: rgb(226, 104, 104); padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin-right: 10px;">
                <input type="reset" value="Reset" style="background-color: #e74c3c; color: rgb(221, 99, 99); padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">
            </div>

        </form>
        <!-- Form End -->

    </div>

</body>
</html>
