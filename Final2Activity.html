<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Document</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: #4a4a4a;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            margin: 0;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }
        .card {
            background-color: #ffffff;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(163, 177, 198, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.6);
            transition: transform 0.2s ease;
        }
        .card:hover {
            transform: translateY(-2px);
        }
        h2 {
            font-size: 1.25rem;
            font-weight: 600;
            color: #5c677d;
            margin-top: 0;
            margin-bottom: 12px;
            letter-spacing: -0.3px;
        }
        p, label {
            font-size: 0.95rem;
            color: #7d8597;
            margin: 8px 0;
        }
        #displayName, #output, #subjectOutput {
            font-weight: 500;
            color: #6c5ce7;
            margin-top: 10px;
        }

        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 12px;
            margin: 10px 0 15px 0;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-family: 'Poppins', sans-serif;
            font-size: 0.9rem;
            box-sizing: border-box;
            background-color: #f8fafc;
            color: #334155;
            transition: all 0.3s ease;
        }
        input[type="text"]:focus, input[type="number"]:focus {
            outline: none;
            border-color: #a29bfe;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(162, 155, 254, 0.2);
        }
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #a29bfe, #6c5ce7);
            color: white;
            border: none;
            border-radius: 8px;
            font-family: 'Poppins', sans-serif;
            font-weight: 500;
            font-size: 0.95rem;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(108, 92, 231, 0.2);
            transition: all 0.2s ease;
        }
        button:hover {
            background: linear-gradient(135deg, #b2adff, #7d6eff);
            box-shadow: 0 6px 14px rgba(108, 92, 231, 0.3);
            transform: scale(1.01);
        }
        button:active {
            transform: scale(0.99);
        }
        #submit {
            background: linear-gradient(135deg, #6c5ce7, #a29bfe);
        }
        #studentDetails {
            background-color: #f0f4f8;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 6px 15px rgba(163, 177, 198, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.5);
            margin-top: 20px;
        }
    </style>
    </head>
    <body>
        <div class="container">
            <div class="card">
            <h2>Student Name</h2>
            <label for="nameInput">Enter Name:</label>
            <input type="text" id="nameInput" placeholder="e.g. Sofia Alexa Ciriaco">
            <p id="displayName"></p>
        </div>
        <div class="card">
            <h2>ID Number:</h2>
            <label for="idInput">Enter ID:</label>
            <input type="text" id="idInput" placeholder="e.g. 2025q0037">
        </div>
        <div class="card">
            <h2>Grade and Section:</h2>
            <label for="gradeInput">Enter Grade:</label>
            <input type="number" id="gradeInput" placeholder="e.g. 12">
            <label for="sectionInput">Enter Section:</label>
            <input type="text" id="sectionInput" placeholder="e.g. Aquinas">
        </div>         
        <div class="card">
            <h2>Age:</h2>
            <label for="ageInput">Enter Age:</label>
            <input type="number" id="ageInput" placeholder="e.g. 17">
            <p style="font-style: italic; font-size: 0.85rem;"></p>
            <script>console.log("HELLO WORLD")</script>
        </div> 
        <div class="card">
            <h2>Email:</h2>
            <label for="emailInput">Enter Email:</label>
            <input type="email" id="emailInput" placeholder="e.g. 2025q0037@pwu.edu.ph">
            <button id="submit" onclick="submitForm()">Submit</button>
            <p id="output"></p>

    <br>
        </div>
    </body>
    <script src="FinalActivity2.js"></script>
</html>
