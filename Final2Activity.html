<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Information Form</title>
    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #eef2f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background-color: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 350px;
        }

        h2, h3 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 5px;
            color: #555;
        }

        input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #e0e0e0;
            border: 1px solid #bbb;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: background 0.2s;
            margin-top: 10px;
        }

        button:hover {
            background-color: #d4d4d4;
        }

        .result-box {
            margin-top: 25px;
            padding-top: 15px;
            border-top: 2px solid #ddd;
            display: none;
        }

        .result-box p {
            margin: 8px 0;
            font-size: 14px;
            color: #444;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Student Information</h2>
        <form id="studentForm">
            <div class="form-group">
                <label for="studentName">Student Name:</label>
                <input type="text" id="studentName" value="Sofia Alexa Ciriaco" required>
            </div>

            <div class="form-group">
                <label for="idNumber">ID Number:</label>
                <input type="text" id="idNumber" value="2025Q0037" required>
            </div>

            <div class="form-group">
                <label for="gradeSection">Grade and Section:</label>
                <input type="text" id="gradeSection" value="12-Aquinas" required>
            </div>

            <div class="form-group">
                <label for="age">Age:</label>
                <input type="number" id="age" value="17" required>
            </div>
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" value="2025q0037@pwu.edu.ph" required>
            </div>
            <button type="submit">Submit</button>
        </form>
        <div class="result-box" id="resultBox">
            <h3>Student Details</h3>
            <p><strong>Name:</strong> <span id="Name"></span></p>
            <p><strong>ID No:</strong> <span id="ID"></span></p>
            <p><strong>Class:</strong> <span id="Class"></span></p>
            <p><strong>Age:</strong> <span id="Age"></span></p>
            <p><strong>Email:</strong> <span id="Email"></span></p>
        </div>
    <script src="FinalActivity2.js"></script>
</body>
</html>
