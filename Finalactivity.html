<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    	<style>
		body {
            background: linear-gradient(90deg, rgb(98, 90, 245) 0%, rgb(64, 222, 228) 35%, rgb(12, 6, 100) 100%);
		}	
		table {
			border: 1px solid blue;
			margin-left: auto;
			margin-right: auto;
		}

		input[type="button"] {
			width: 100%;
			padding: 20px 40px;
			background-color: green;
			color: peachpuff;
			font-size: 24px;
			font-weight: bold;
			border: none;
			border-radius: 5px;
		}
        
		button:hover {
        background:linear-gradient(to bottom, #408c99 5%, #599bb3 100%);
        background-color:#408c99;
		color:#ffffff;
	}
		input[type="text"] {
			padding: 20px 30px;
			font-size: 24px;
			font-weight: bold;
			border: none;
			border-radius: 5px;
			border: 2px solid pink;
		}
	</style>
</head>
<body>
    
    <p> Arithmetic Functions</p>
    
    <input type="text" id="num1" placeholder="Enter first number"><br>
    <input type="text" id="num2" placeholder="Enter second number"><br>
    <br>
    <button onclick="add()">Add</button>
    <button onclick="subtract()">Subtract</button>
    <button onclick="multiply()">Multiply</button>
    <button onclick="divide()">Divide</button>
    <button onclick="remainder()">Remainder</button>

    <br>
    <p id="result"></p>
</body>
<script src="FinalActivity.js"></script>
</html>
