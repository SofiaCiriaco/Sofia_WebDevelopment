<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Art Activity</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #eef2f3;
            margin: 0;
        }
        .art-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
            text-align: center;
        }
        h2 {
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 15px;
        }
        /* Art Canvas Container */
        .canvas {
            width: 500px;
            height: 300px;
            position: relative;
            overflow: hidden;
            border: 3px solid #333;
            background-color: #87CEEB; /* Default sky color */
            transition: background-color 0.5s;
        }
        /* Art Elements */
        .sun {
            width: 60px;
            height: 60px;
            background-color: #FFD700;
            border-radius: 50%;
            position: absolute;
            top: 30px;
            left: 70px;
            transition: all 0.5s;
        }
        .mountain {
            position: absolute;
            bottom: 60px;
            width: 0;
            height: 0;
            border-left: 150px solid transparent;
            border-right: 150px solid transparent;
            border-bottom: 180px solid #708090;
            left: -20px;
            transition: border-bottom-color 0.5s;
        }
        .mountain-2 {
            left: 180px;
            border-bottom: 200px solid #5a6978;
        }
        .grass {
            width: 100%;
            height: 80px;
            background-color: #228B22;
            position: absolute;
            bottom: 0;
            transition: background-color 0.5s;
        }
        .river {
            width: 120px;
            height: 80px;
            background-color: #1E90FF;
            position: absolute;
            bottom: 0;
            left: 200px;
            clip-path: polygon(20% 0%, 60% 0%, 100% 100%, 0% 100%);
            transition: background-color 0.5s;
        }
        .house {
            position: absolute;
            bottom: 30px;
            right: 60px;
            width: 80px;
            height: 70px;
            background-color: #DEB887;
            transition: background-color 0.5s;
        }
        .roof {
            position: absolute;
            bottom: 100px;
            right: 50px;
            width: 0;
            height: 0;
            border-left: 50px solid transparent;
            border-right: 50px solid transparent;
            border-bottom: 40px solid #A52A2A;
            transition: border-bottom-color 0.5s;
        }
        .tree {
            position: absolute;
            bottom: 60px;
            left: 120px;
            width: 15px;
            height: 40px;
            background-color: #8B4513;
            transition: background-color 0.5s;
        }
        .tree-leaves {
            position: absolute;
            bottom: 90px;
            left: 102px;
            width: 50px;
            height: 50px;
            background-color: #006400;
            border-radius: 50%;
            transition: background-color 0.5s;
        }
        .rock {
            width: 40px;
            height: 25px;
            background-color: #808080;
            border-radius: 50% 50% 40% 40%;
            position: absolute;
            bottom: 15px;
            left: 40px;
            transition: background-color 0.5s;
        }
        /* Control Panel */
        .controls {
            margin-top: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            max-width: 520px;
        }
        .controls button {
            padding: 6px 12px;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            background-color: #f7f7f7;
            border: 1px solid #bcbcbc;
            border-radius: 3px;
        }
        .controls button:hover {
            background-color: #ddd;
        }
        /* Utility class to hide features */
        .hidden {
            display: none !important;
        }
        /* Light Mode / Grayscale Art Override */
        .light-mode-art .sun { background-color: #f0f0f0; border: 2px solid #333; }
        .light-mode-art .mountain { border-bottom-color: #d3d3d3; }
        .light-mode-art .mountain-2 { border-bottom-color: #bebebe; }
        .light-mode-art .grass { background-color: #e0e0e0; }
        .light-mode-art .river { background-color: #cccccc; }
        .light-mode-art .house { background-color: #eaeaea; border: 1px solid #333; }
        .light-mode-art .roof { border-bottom-color: #999999; }
        .light-mode-art .tree { background-color: #777777; }
        .light-mode-art .tree-leaves { background-color: #b5b5b5; }
        .light-mode-art .rock { background-color: #aaaaaa; }
        .light-mode-art.canvas { background-color: #ffffff; }
    </style>
</head>
<body>

    <div class="art-card">
        <h2>My Changing Art Using JavaScript</h2>
        
        <!-- Art Canvas Container -->
        <div id="canvas" class="canvas">
            <div id="sunElement" class="sun"></div>
            <div id="mountainElement" class="mountain"></div>
            <div id="mountainElement2" class="mountain mountain-2"></div>
            <div id="grassElement" class="grass"></div>
            <div id="treeElement" class="tree"></div>
            <div id="treeLeaves" class="tree-leaves"></div>
            <div id="riverElement" class="river"></div>
            <div id="roofElement" class="roof"></div>
            <div id="houseElement" class="house"></div>
            <div id="rockElement" class="rock"></div>
        </div>

        <!-- Interactive Control Buttons -->
        <div class="controls">
            <button onclick="toggleElement('sunElement')">Sun</button>
            <button onclick="toggleElement('grassElement')">Grass</button>
            <button onclick="toggleElements(['mountainElement', 'mountainElement2'])">Mountain</button>
            <button onclick="toggleElements(['treeElement', 'treeLeaves'])">Trees</button>
            <button onclick="toggleElements(['houseElement', 'roofElement'])">House</button>
            <button onclick="toggleElement('rockElement')">Rock</button>
            <button onclick="toggleElement('riverElement')">River</button>
            <button onclick="setArtMode('light')">Light Mode</button>
            <button onclick="setArtMode('colored')">Colored Mode</button>
        </div>
    </div>

    <script>
        // Toggles visibility of single items
        function toggleElement(id) {
            const el = document.getElementById(id);
            el.classList.toggle('hidden');
        }

        // Toggles multiple grouped items (like tree base + leaves)
        function toggleElements(ids) {
            ids.forEach(id => {
                document.getElementById(id).classList.toggle('hidden');
            });
        }

        // Switches between colored scenery and grayscale Light Mode layout
        function setArtMode(mode) {
            const canvas = document.getElementById('canvas');
            if (mode === 'light') {
                canvas.classList.add('light-mode-art');
            } else {
                canvas.classList.remove('light-mode-art');
            }
        }
    </script>

</body>
</html>
